```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR Ёлка</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Анимации для GLB -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #start {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);

      padding: 16px 28px;
      border: 0;
      border-radius: 30px;

      font-size: 18px;
      background: white;
      color: black;
    }

    #hint {
      position: fixed;
      z-index: 1000;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);

      color: white;
      font-family: Arial, sans-serif;
      font-size: 17px;
      text-align: center;

      width: 90%;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="hint">
    Наведи камеру на рисунок ✨
  </div>

  <button id="start">
    Открыть AR
  </button>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      maxTrack: 1;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>

      <a-asset-item
        id="tree"
        src="./tree.glb">
      </a-asset-item>

    </a-assets>


    <!-- Камера -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- Наш AR-маркер -->
    <a-entity
      mindar-image-target="targetIndex: 0">


      <!-- Ёлка -->
      <a-gltf-model
        id="treeModel"

        src="#tree"

        position="0 0 0.1"

        rotation="0 0 0"

        scale="0.5 0.5 0.5"

        animation-mixer
      >
      </a-gltf-model>


    </a-entity>

  </a-scene>


  <script>

    const startButton =
      document.getElementById("start");

    const hint =
      document.getElementById("hint");

    const scene =
      document.querySelector("a-scene");


    startButton.addEventListener("click", async () => {

      startButton.style.display = "none";

      try {

        await scene.systems["mindar-image-system"].start();

      } catch (error) {

        console.error(error);

        hint.innerText =
          "Не удалось открыть камеру";

      }

    });


    const target =
      document.querySelector(
        "[mindar-image-target]"
      );


    target.addEventListener("targetFound", () => {

      hint.innerText =
        "✨ Магия начинается...";

    });


    target.addEventListener("targetLost", () => {

      hint.innerText =
        "Наведи камеру на рисунок";

    });

  </script>

</body>
</html>
