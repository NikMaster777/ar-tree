```html
<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AR тест</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

  </style>

</head>


<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!--
      Когда MindAR найдёт target,
      здесь появится красный куб.
    -->

    <a-entity
      mindar-image-target="targetIndex: 0"
    >

      <a-box
        position="0 0 0.15"
        rotation="0 0 0"
        color="red"
        depth="0.2"
        height="0.2"
        width="0.2"
      >
      </a-box>

    </a-entity>


  </a-scene>

</body>

</html>
```
